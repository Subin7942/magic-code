<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>text 스타일 실습</title>
  </head>
  <body>
    <h1>텍스트 스타일 실습</h1>

    <p class="normal">이 문장은 <strong>기본 스타일</strong>입니다.</p>
    <p>이 문장은 <span class="italic">기울임 효과</span>가 적용되었습니다.</p>
    <p class="oblique">이 문장은 <span>oblique</span> 효과입니다.</p>
    <p class="weight">이 문장은 굵기 조절이 포함되어 있습니다</p>
    <p class="size">이 문장은 다양한 글자 크기를 보여줍니다</p>

    <p class="font">이 문장은 <span>다른 글꼴</span>이 적용되었습니다</p>
  </body>
</html>
