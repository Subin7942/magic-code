<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지와 텍스트 스타일</title>
  <link rel="stylesheet" href="./styles/style.css" />
</head>
<body>
  <h1>이미지 삽입</h1>

  <img 
  class="img-fixed"
  src="./assets/02.png" alt="고정 크기 이미지" title="width, height 사용"/>

  <img 
  class="img-ratio"
  src="./assets/02.png" alt="비율 유지 이미지" title="aspect-ratio 사용"/>

  <img 
  class="img-responsive"
  src="./assets/02.png" alt="반응형 이미지" 
  title="% 사용"/>

  <img 
  class="img-viewport"
  src="./assets/02.png" alt="vw, vh 이미지" 
  title="vw, vh 사용"/>


</body>
</html>
